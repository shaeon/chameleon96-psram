# Compila los RBF del test PSRAM de la Chameleon96 en GitHub, igual que el
# build del Aleste520EX: imagen publica raetro/quartus, docker pull + docker
# run, sin registros ni imagenes propias.
#
# Unica diferencia: aqui hay una MATRIZ de frecuencias, para sacar un .rbf
# por cada velocidad de sclk y ver en la placa cual es la mas alta sin fallos.
#
# - push / pull request: simula y compila 144 MHz.
# - A mano (Actions > Build RBF > Run workflow): elige tops y frecuencias.
# - Etiqueta v*: Release con todos los .rbf.

name: Build RBF

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'releases/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'releases/**'
  workflow_dispatch:
    inputs:
      tops:
        description: 'Tops a compilar (JSON)'
        required: true
        default: '["psram_qspi_test_dual"]'
      freqs:
        description: 'Frecuencias del sclk en MHz (JSON)'
        required: true
        default: '[120, 144, 160, 180]'

permissions:
  contents: write          # para crear la Release en las etiquetas v*

env:
  # Imagen publica, como la 17.0 del Aleste. Es la mas nueva que publica
  # raetro. El proyecto esta generado con ACDS 22.1, pero el IP ya viene
  # generado en el repo (SYNTHESIS_ONLY_QIP ON), asi que 21.1 solo tiene que
  # sintetizar Verilog.
  QUARTUS_IMAGE: raetro/quartus:21.1.1

jobs:
  # Simulacion: un minuto, sin Quartus. Si el dual no pasa en iverilog, no
  # tiene sentido gastar sintesis.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Test dual a 144 MHz
        run: |
          iverilog -g2012 -DMODEL_WAIT_EB=7 -o dual.vvp \
            sim/tb_psram_dual.sv rtl/psram.sv rtl/psram_test_ctrl.sv rtl/aps6404l_model.sv
          vvp dual.vvp | tee sim.log
          grep -q "VERDICT: PASS" sim.log

      - name: Barrido frecuencia x tACLK
        run: |
          ./scripts/run_sweep.sh . | tee sweep.log
          {
            echo "## Barrido en simulacion"
            echo '```'
            cat sweep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-logs
          path: |
            sim.log
            sweep.log

  rbf:
    needs: sim
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false      # una frecuencia que no cierre no tumba las demas
      matrix:
        top:  ${{ fromJSON(github.event.inputs.tops  || '["psram_qspi_test_dual"]') }}
        freq: ${{ fromJSON(github.event.inputs.freqs || '[144]') }}

    steps:
      # La imagen de Quartus ocupa unos 6 GB comprimida: se libera sitio en la
      # maquina de GitHub antes de descargarla.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Descargar Quartus
        run: docker pull "$QUARTUS_IMAGE"

      - name: Compilar ${{ matrix.top }} a ${{ matrix.freq }} MHz
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE":/build -w /build "$QUARTUS_IMAGE" \
            -c "quartus_sh --version && ./scripts/build.sh ${{ matrix.top }} ${{ matrix.freq }}"

      # Resumen de tiempos en la pagina de la ejecucion; aviso si alguna
      # holgura es negativa (no para la compilacion: el .rbf sale igual)
      - name: Resumen de tiempos
        if: always()
        run: |
          STA=$(ls quartus/output_files/*.sta.rpt 2>/dev/null | head -1)
          [ -f "$STA" ] || { echo "No hay informe de tiempos" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## ${{ matrix.top }} a ${{ matrix.freq }} MHz"
            echo '```'
            for s in "Setup Summary" "Hold Summary" "Recovery Summary" "Removal Summary"; do
              echo "== $s"
              sed -n "/; $s/,/^$/p" "$STA" | grep '^; [^C-]' | grep -v 'Clock *;' | cut -c1-110
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if sed -n '/Setup Summary/,/Removal Summary/p' "$STA" | grep -qE ';[[:space:]]*-[0-9]+\.[0-9]+[[:space:]]*;'; then
            echo "::warning title=Tiempos::${{ matrix.freq }} MHz tiene holguras negativas"
          fi

      - name: Preparar el resultado
        if: always()
        run: |
          VAR=${{ matrix.top }}_${{ matrix.freq }}MHz
          mkdir -p dist
          [ -f quartus/output_files/$VAR.rbf ] && cp quartus/output_files/$VAR.rbf dist/
          for r in map fit sta flow asm; do
            f=$(ls quartus/output_files/*.$r.rpt 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" "dist/${VAR}.$r.rpt"
          done
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.top }}_${{ matrix.freq }}MHz
          path: dist/
          retention-days: 30

  release:
    needs: rbf
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Juntar los rbf
        run: |
          mkdir -p release
          find artifacts -name '*.rbf' -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.rbf
          generate_release_notes: true
          body: |
            RBF del test PSRAM (chip1 + chip2 a la vez), uno por frecuencia.

            En la placa: D5 arrancado, D6 error chip1, D7 error chip2,
            D8 heartbeat. La frecuencia mas alta sin D6 ni D7 es la buena.
